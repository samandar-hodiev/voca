# Dart static analysis for the Voca mobile app.
#
# Enforced in CI. Rules are not disabled to make a build pass; a rule that fires is
# either obeyed or removed deliberately with a reason.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Architecture boundaries are documented in ARCHITECTURE.md 31.1 and reviewed by hand:
    #   features/*/domain      must not import flutter, dio, or a JSON codec
    #   features/*/presentation must not import that feature's data layer
    #   core                   must not import features
    # The analyzer cannot express those, so they stay a review responsibility.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Correctness.
    - always_declare_return_types
    - avoid_empty_else
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures

    # Clarity.
    - prefer_single_quotes
    - prefer_final_locals
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_parenthesis

    # Flutter specifics.
    - use_colored_box
    - use_decorated_box
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
