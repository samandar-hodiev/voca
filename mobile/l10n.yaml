# Generates AppLocalizations from lib/l10n/app_*.arb. English is the template, so every
# key has to exist in English first; Uzbek and Russian must cover every key too.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
