name: voca
description: "Voca — AI-powered English pronunciation coach."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection. Riverpod is both, which is why the
  # composition root in core/di is a set of providers (ARCHITECTURE.md 4.3).
  flutter_riverpod: ^2.6.1

  # Routing, deep links and redirect guards (ARCHITECTURE.md 4.4).
  go_router: ^14.6.2

  # The single HTTP client. Interceptors give one place for auth, request IDs, retries
  # and error mapping (ARCHITECTURE.md 4.5). No second networking library.
  dio: ^5.7.0

  # Localization. Uzbek is the first UI language.
  intl: ^0.20.2

  # Non-secret local flags: whether onboarding has been completed, last selected tab.
  shared_preferences: ^2.3.3

  # Google sign-in. The button stays disabled until the backend reports a configured
  # OAuth client, so the package is never exercised without one.
  google_sign_in: ^6.2.2

  # Tokens only: Keychain on iOS, EncryptedSharedPreferences on Android.
  # Nothing else belongs here, and nothing here belongs anywhere else
  # (ARCHITECTURE.md 4.5, 18.2).
  flutter_secure_storage: ^9.2.2

  # Choosing a profile picture from the camera or the library. Needed because the
  # account cannot be created without one.
  image_picker: ^1.1.2

  # Sign in with Google. Firebase is the identity provider and nothing more: it turns a
  # Google credential into an ID token this app forwards to the Voca backend, which is
  # where users, sessions and every business rule actually live (ADR-019).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Dependencies deliberately NOT added yet, each arriving with the feature that needs it:
#   record, just_audio       with pronunciation practice
#   purchases_flutter        with subscriptions
#   firebase_*               with notifications and analytics
#   drift or isar            with offline caching
# Adding them now would be speculative (ARCHITECTURE.md 35).

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
