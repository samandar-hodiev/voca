name: voca
description: "Voca — AI-powered English pronunciation coach."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection. Riverpod is both, which is why the
  # composition root in core/di is a set of providers (ARCHITECTURE.md 4.3).
  flutter_riverpod: ^2.6.1

  # Routing, deep links and redirect guards (ARCHITECTURE.md 4.4).
  go_router: ^14.6.2

  # The single HTTP client. Interceptors give one place for auth, request IDs, retries
  # and error mapping (ARCHITECTURE.md 4.5). No second networking library.
  dio: ^5.7.0

  # Localization. Uzbek is the first UI language.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Dependencies deliberately NOT added yet, each arriving with the feature that needs it:
#   flutter_secure_storage   with authentication
#   record, just_audio       with pronunciation practice
#   purchases_flutter        with subscriptions
#   firebase_*               with notifications and analytics
#   drift or isar            with offline caching
# Adding them now would be speculative (ARCHITECTURE.md 35).

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
